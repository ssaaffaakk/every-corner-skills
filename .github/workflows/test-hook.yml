name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-hook:
    name: Hook tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run hook tests (with jq and with the no-jq fallback)
        env:
          # On macOS, run the hook with the system bash 3.2, as users' Macs do.
          HOOK_BASH: ${{ matrix.os == 'macos-latest' && '/bin/bash' || 'bash' }}
        run: |
          chmod +x hooks/explain-risky-commands.sh hooks/test-hook.sh
          ./hooks/test-hook.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck the hook and its tests
        run: shellcheck -S warning hooks/*.sh

  validate:
    name: Plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.332
      - name: Validate plugin, marketplace and skills (strict)
        run: claude plugin validate --strict .
