name: Test hook

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hook tests
        run: |
          chmod +x hooks/explain-risky-commands.sh hooks/test-hook.sh
          ./hooks/test-hook.sh
      - name: Run style guard hook tests
        run: |
          chmod +x hooks/require-style-study.sh hooks/test-style-guard.sh
          ./hooks/test-style-guard.sh
      - name: Run style-counts tests
        run: |
          chmod +x tests/matchcodebase/test-style-counts.sh
          ./tests/matchcodebase/test-style-counts.sh
