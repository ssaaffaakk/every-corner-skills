schema_version: "1.1"
name: matchcodebase-trigger-add
description: Adding a function to a project that already has code must start every-corner-matchcodebase first.
tags: [matchcodebase, should-trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Add a function countOrders(path) to app/orders.py that returns how many orders the file has."
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write, Bash]
