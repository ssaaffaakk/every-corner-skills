<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="every corner: Claude Code skills that work like a senior developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>

  <!-- House outline -->
  <g transform="translate(150 70)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 110 L120 20 L220 110" stroke="#e2e8f0" stroke-width="10"/>
    <path d="M45 95 V210 H195 V95" stroke="#e2e8f0" stroke-width="10"/>
    <rect x="100" y="140" width="40" height="70" rx="4" stroke="#94a3b8" stroke-width="6"/>
    <!-- Every corner lit -->
    <circle cx="45" cy="210" r="22" fill="url(#glow)" stroke="none"/>
    <circle cx="195" cy="210" r="22" fill="url(#glow)" stroke="none"/>
    <circle cx="45" cy="95" r="22" fill="url(#glow)" stroke="none"/>
    <circle cx="195" cy="95" r="22" fill="url(#glow)" stroke="none"/>
    <circle cx="45" cy="210" r="7" fill="#fbbf24" stroke="none"/>
    <circle cx="195" cy="210" r="7" fill="#fbbf24" stroke="none"/>
    <circle cx="45" cy="95" r="7" fill="#fbbf24" stroke="none"/>
    <circle cx="195" cy="95" r="7" fill="#fbbf24" stroke="none"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="450" y="165" fill="#f8fafc" font-size="78" font-weight="800" letter-spacing="-1.5">every corner</text>
    <text x="453" y="218" fill="#cbd5e1" font-size="26" font-weight="500">Claude Code skills that work like a senior developer</text>
    <text x="453" y="268" fill="#fbbf24" font-size="22" font-weight="600" letter-spacing="0.5">TOUR  ·  INTERVIEW  ·  EXPLAIN</text>
  </g>
</svg>
